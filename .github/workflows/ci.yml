name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p autumn-plugin-leptos-client --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace

  browser:
    name: browser tests (Chromium, committed bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest has Google Chrome on PATH.
      - run: cargo test --locked --all-features --test browser --test e2e -- --ignored --test-threads=1
      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-tests
          path: target/system-tests/

  bundle:
    name: demo bundle (fresh, builds, works)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on a stale bundle
        run: examples/islands-app/build.sh --check
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/islands-app
      - name: fmt + clippy of the demo wasm crate
        working-directory: examples/islands-app
        run: |
          cargo fmt -- --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the bundle from source
        run: examples/islands-app/build.sh
      - name: Browser tests with the new bundle
        run: cargo test --locked --all-features --test browser --test e2e -- --ignored --test-threads=1

  coverage:
    name: coverage (≥ 85% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --all-features --all-targets --summary-only --fail-under-lines 85

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --lib -p autumn-plugin-leptos -p autumn-plugin-leptos-client --all-features
